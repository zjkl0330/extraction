<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // 防止深色模式闪烁（FOUC）
    (function(){var t=localStorage.getItem('tiksaver-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title data-i18n="pageTitle">私人视频下载工具</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary: #7c3aed;
      --color-primary-hover: #6d28d9;
      --color-primary-light: #f5f3ff;
      --color-primary-lighter: #ede9fe;
      --color-bg: #ffffff;
      --color-bg-soft: #faf9ff;
      --color-surface: #ffffff;
      --color-text: #1f2937;
      --color-text-secondary: #6b7280;
      --color-border: #e5e7eb;
      --color-error: #ef4444;
      --color-error-bg: #fef2f2;
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-header-bg: rgba(255,255,255,.85);
      --color-mobile-nav-bg: #fff;
      --color-skeleton: #f3f4f6;
      --color-skeleton-2: #e5e7eb;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(124,58,237,.08), 0 2px 6px rgba(0,0,0,.04);
      --shadow-lg: 0 12px 32px rgba(124,58,237,.1), 0 4px 12px rgba(0,0,0,.05);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    }

    /* ── Dark Mode ── */
    [data-theme="dark"] {
      --color-primary: #a855f7;
      --color-primary-hover: #9333ea;
      --color-primary-light: #2e1065;
      --color-primary-lighter: #3b0764;
      --color-bg: #0f0f14;
      --color-bg-soft: #16161e;
      --color-surface: #1a1a24;
      --color-text: #f3f4f6;
      --color-text-secondary: #9ca3af;
      --color-border: #2a2a35;
      --color-error-bg: #450a0a;
      --color-header-bg: rgba(15,15,20,.85);
      --color-mobile-nav-bg: #1a1a24;
      --color-skeleton: #2a2a35;
      --color-skeleton-2: #3a3a48;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.2);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.3);
    }

    body { font-family: var(--font); background: var(--color-bg); color: var(--color-text); line-height: 1.6; min-height: 100vh; }

    /* ── Header ── */
    .header { position: sticky; top: 0; z-index: 100; background: var(--color-header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .lang-switch { background: var(--color-primary-light); color: var(--color-primary); border: none; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .lang-switch:hover { background: var(--color-primary-lighter); }
    .theme-switch { background: var(--color-primary-light); color: var(--color-primary); border: none; width: 36px; height: 36px; border-radius: 999px; font-size: 16px; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
    .theme-switch:hover { background: var(--color-primary-lighter); transform: rotate(15deg); }

    /* ── Hero ── */
    .hero { padding: 56px 24px 40px; text-align: center; background: linear-gradient(180deg, var(--color-bg-soft) 0%, var(--color-bg) 100%); }
    .hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 12px; background: linear-gradient(135deg, #1f2937 0%, #7c3aed 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    [data-theme="dark"] .hero h1 { background: linear-gradient(135deg, #f3f4f6 0%, #a855f7 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero .subtitle { font-size: 15px; color: var(--color-text-secondary); max-width: 560px; margin: 0 auto 32px; line-height: 1.7; }
    .private-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--color-primary-light); color: var(--color-primary); margin-bottom: 16px; }

    /* ── Input area ── */
    .input-area { max-width: 680px; margin: 0 auto; }
    .input-wrapper { display: flex; gap: 10px; margin-bottom: 14px; }
    .input-main { flex: 1; padding: 14px 18px; font-size: 15px; font-family: var(--font); color: var(--color-text); background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-sm); outline: none; transition: border-color .2s, box-shadow .2s; }
    .input-main:focus { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(124,58,237,.1); }
    .input-main::placeholder { color: #9ca3af; }
    .btn-parse { padding: 14px 32px; font-size: 15px; font-weight: 700; font-family: var(--font); color: #fff; background: var(--color-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; transition: background .2s, transform .1s; }
    .btn-parse:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn-parse:active:not(:disabled) { transform: scale(.97); }
    .btn-parse:disabled { opacity: .6; cursor: not-allowed; }
    .input-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-aux { padding: 8px 20px; font-size: 13px; font-weight: 500; font-family: var(--font); color: var(--color-text); background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: 8px; cursor: pointer; transition: all .2s; }
    .btn-aux:hover { border-color: var(--color-primary); color: var(--color-primary); }

    /* ── Platform badges ── */
    .platforms-bar { max-width: 680px; margin: 20px auto 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .platform-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-secondary); transition: all .2s; }
    .platform-badge:hover { border-color: var(--color-primary); color: var(--color-primary); transform: translateY(-1px); }
    .platform-badge .pf-icon { font-size: 14px; }

    /* ── Loading skeleton ── */
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton-card { max-width: 680px; margin: 24px auto 0; padding: 24px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); display: none; }
    .skeleton-card.visible { display: block; }
    .skeleton-line { height: 16px; background: linear-gradient(90deg, var(--color-skeleton) 25%, var(--color-skeleton-2) 50%, var(--color-skeleton) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; margin-bottom: 12px; }
    .skeleton-line.w-60 { width: 60%; } .skeleton-line.w-80 { width: 80%; } .skeleton-line.w-100 { width: 100%; }
    .skeleton-box { height: 200px; background: linear-gradient(90deg, var(--color-skeleton) 25%, var(--color-skeleton-2) 50%, var(--color-skeleton) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; margin-top: 16px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Error ── */
    .error-msg { max-width: 680px; margin: 16px auto 0; padding: 12px 16px; background: var(--color-error-bg); border: 1px solid #fecaca; border-radius: 8px; color: #dc2626; font-size: 14px; display: none; }
    .error-msg.visible { display: block; }

    /* ── Result ── */
    .result-area { max-width: 680px; margin: 24px auto 0; display: none; }
    .result-area.visible { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .result-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-md); }
    .result-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--color-border); }
    .result-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--color-primary-light); flex-shrink: 0; }
    .result-author { font-weight: 700; font-size: 15px; }
    .result-desc { font-size: 13px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .result-type-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
    .result-type-badge.video { background: #dbeafe; color: #1d4ed8; }
    .result-type-badge.image { background: #fef3c7; color: #b45309; }
    .platform-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; background: #f3e8ff; color: #7c3aed; }
    .result-note { margin-top: 12px; padding: 10px 14px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; font-size: 13px; color: #92400e; line-height: 1.5; }
    .result-body { padding: 20px; }
    .result-video { width: 100%; max-height: 400px; border-radius: 12px; background: #000; }
    .result-cover-preview { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; background: var(--color-primary-light); display: none; }
    .result-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .result-images img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform .2s; }
    .result-images img:hover { transform: scale(1.03); }
    .result-stats { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    .stat { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--color-text-secondary); }
    .stat-icon { font-size: 16px; }
    .result-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn-download { display: flex; align-items: center; gap: 6px; padding: 12px 24px; font-size: 14px; font-weight: 600; font-family: var(--font); color: #fff; background: var(--color-primary); border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background .2s; }
    .btn-download:hover { background: var(--color-primary-hover); }
    .btn-download.music { background: var(--color-warning); }
    .btn-download.music:hover { background: #d97706; }

    /* ── History ── */
    .history { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .history-header h2 { font-size: 20px; font-weight: 700; }
    .btn-clear-history { font-size: 13px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; text-decoration: underline; }
    .btn-clear-history:hover { color: var(--color-error); }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; cursor: pointer; transition: border-color .2s; }
    .history-item:hover { border-color: var(--color-primary); }
    .history-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--color-primary-light); flex-shrink: 0; }
    .history-info { flex: 1; min-width: 0; }
    .history-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { font-size: 12px; color: var(--color-text-secondary); }

    /* ── Footer ── */
    .footer { background: var(--color-bg-soft); border-top: 1px solid var(--color-border); padding: 32px 24px; text-align: center; }
    .footer-copy { font-size: 12px; color: var(--color-text-secondary); }

    /* ── Back to top ── */
    .back-to-top { position: fixed; bottom: 32px; right: 32px; width: 44px; height: 44px; background: var(--color-primary); color: #fff; border: none; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s, transform .2s; z-index: 90; }
    .back-to-top.visible { opacity: 1; visibility: visible; }
    .back-to-top:hover { transform: translateY(-4px); background: var(--color-primary-hover); }

    /* ── Image lightbox ── */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 40px; }
    .lightbox.visible { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 50%; font-size: 24px; cursor: pointer; }

    /* ── Toast ── */
    .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .toast.error { background: var(--color-error-bg); color: #dc2626; border: 1px solid #fecaca; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .header-inner { padding: 0 16px; height: 56px; }
      .hero { padding: 40px 16px 28px; }
      .hero h1 { font-size: 26px; }
      .input-wrapper { flex-direction: column; }
      .btn-parse { width: 100%; }
      .back-to-top { bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <!-- Main App -->
  <div id="mainApp" style="display:none">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">TikSaver</a>
      <div class="header-actions">
        <button class="theme-switch" onclick="toggleTheme()" id="themeSwitch" title="切换主题">🌙</button>
        <button class="lang-switch" onclick="toggleLang()">EN</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="private-tag"><span>🔒</span><span data-i18n="privateTag">私人使用</span></div>
    <h1 data-i18n="heroTitle">多平台视频下载</h1>
    <p class="subtitle" data-i18n="heroSubtitle">支持 TikTok、抖音、快手、小红书、哔哩哔哩、YouTube、Instagram，视频图片图集一键下载。</p>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" class="input-main" id="urlInput" data-i18n-placeholder="inputPlaceholder" placeholder="粘贴 TikTok / 抖音 / 快手 / 小红书 / B站 链接..." />
        <button class="btn-parse" id="parseBtn" onclick="parseVideo()" data-i18n="btnParse">解析视频</button>
      </div>
      <div class="input-actions">
        <button class="btn-aux" onclick="pasteClipboard()" data-i18n="btnPaste">粘贴</button>
        <button class="btn-aux" onclick="clearInput()" data-i18n="btnClear">清除</button>
      </div>
    </div>

    <!-- Supported platforms -->
    <div class="platforms-bar">
      <span class="platform-badge"><span class="pf-icon">🎵</span>TikTok</span>
      <span class="platform-badge"><span class="pf-icon">🎬</span>抖音</span>
      <span class="platform-badge"><span class="pf-icon">⚡</span>快手</span>
      <span class="platform-badge"><span class="pf-icon">📕</span>小红书</span>
      <span class="platform-badge"><span class="pf-icon">📺</span>哔哩哔哩</span>
      <span class="platform-badge"><span class="pf-icon">▶️</span>YouTube</span>
      <span class="platform-badge"><span class="pf-icon">📷</span>Instagram</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Loading skeleton -->
    <div class="skeleton-card" id="skeletonCard">
      <div class="skeleton-line w-60"></div>
      <div class="skeleton-line w-80"></div>
      <div class="skeleton-box"></div>
    </div>

    <!-- Result -->
    <div class="result-area" id="resultArea">
      <div class="result-card">
        <div class="result-header">
          <img class="result-avatar" id="resultAvatar" src="" alt="" onerror="this.style.display='none'" />
          <div style="flex:1;min-width:0;">
            <div>
              <span class="result-author" id="resultAuthor"></span>
              <span class="result-type-badge video" id="resultTypeBadge">视频</span>
            </div>
            <div class="result-desc" id="resultDesc"></div>
          </div>
        </div>
        <div class="result-body">
          <!-- Video result -->
          <video class="result-video" id="resultVideo" controls preload="metadata" playsinline style="display:none"></video>
          <!-- Fallback cover preview (shown if video fails to load) -->
          <div id="resultCoverWrap" style="position:relative;display:none;cursor:pointer;">
            <img class="result-cover-preview" id="resultCoverImg" src="" alt="cover" />
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);border-radius:12px;">
              <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:28px;">▶</div>
            </div>
          </div>
          <!-- Image gallery result -->
          <div class="result-images" id="resultImages" style="display:none"></div>
          <!-- Stats -->
          <div class="result-stats" id="resultStats"></div>
          <!-- Actions -->
          <div class="result-actions">
            <a class="btn-download" id="downloadVideo" href="#" style="display:none">
              <span>⬇️</span><span data-i18n="btnDownloadVideo">下载视频</span>
            </a>
            <a class="btn-download" id="downloadAllImages" href="#" style="display:none">
              <span>🖼️</span><span data-i18n="btnDownloadAllImages">下载全部图片</span>
            </a>
            <a class="btn-download music" id="downloadMusic" href="#" style="display:none">
              <span>🎵</span><span data-i18n="btnDownloadMusic">下载音乐</span>
            </a>
            <button class="btn-download" id="copyLinkBtn" style="display:none;background:#6b7280" onclick="copyVideoLink()">
              <span>🔗</span><span data-i18n="btnCopyLink">复制链接</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- History -->
  <section class="history" id="historySection" style="display:none">
    <div class="history-header">
      <h2 data-i18n="historyTitle">下载历史</h2>
      <button class="btn-clear-history" onclick="clearHistory()" data-i18n="btnClearHistory">清空历史</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-copy" id="footerCopy"></div>
  </footer>

  </div><!-- /mainApp -->

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <!-- Image lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ── i18n ─────────────────────────────────────
    const I18N = {
      zh: {
        pageTitle: "私人视频下载工具",
        privateTag: "私人使用",
        heroTitle: "多平台视频下载",
        heroSubtitle: "支持 TikTok、抖音、快手、小红书、哔哩哔哩、YouTube、Instagram，视频图片图集一键下载。",
        inputPlaceholder: "粘贴 TikTok / 抖音 / 快手 / 小红书 / B站 链接...",
        btnParse: "解析视频", btnPaste: "粘贴", btnClear: "清除",
        btnParsing: "解析中...", btnDownloadVideo: "下载视频", btnDownloadMusic: "下载音乐", btnDownloadAllImages: "下载全部图片", btnCopyLink: "复制链接",
        historyTitle: "下载历史", btnClearHistory: "清空历史",
        toastPasteSuccess: "已粘贴", toastPasteFail: "粘贴失败，请手动粘贴",
        toastHistoryCleared: "历史已清空", toastCopied: "链接已复制",
        errorEmpty: "请输入视频链接", errorParse: "解析失败，请检查链接是否正确",
        badgeVideo: "视频", badgeImage: "图集",
        langLabel: "EN",
        historyEmpty: "暂无下载历史",
      },
      en: {
        pageTitle: "Private Video Downloader",
        privateTag: "Private",
        heroTitle: "Multi-Platform Video Downloader",
        heroSubtitle: "Supports TikTok, Douyin, Kuaishou, Xiaohongshu, Bilibili, YouTube, Instagram.",
        inputPlaceholder: "Paste TikTok / Douyin / Kuaishou / XHS / Bilibili link...",
        btnParse: "Parse", btnPaste: "Paste", btnClear: "Clear",
        btnParsing: "Parsing...", btnDownloadVideo: "Download Video", btnDownloadMusic: "Download Music", btnDownloadAllImages: "Download All Images", btnCopyLink: "Copy Link",
        historyTitle: "Download History", btnClearHistory: "Clear History",
        toastPasteSuccess: "Pasted", toastPasteFail: "Paste failed, please paste manually",
        toastHistoryCleared: "History cleared", toastCopied: "Link copied",
        errorEmpty: "Please enter a video link", errorParse: "Parse failed, please check the link",
        badgeVideo: "Video", badgeImage: "Gallery",
        langLabel: "中文",
        historyEmpty: "No download history yet",
      },
    };

    let currentLang = (() => {
      const stored = localStorage.getItem('tiktok-lang');
      if (stored && I18N[stored]) return stored;
      return navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    })();

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('tiktok-lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
      const t = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key] !== undefined) el.placeholder = t[key];
      });
      const ls = document.querySelector('.lang-switch');
      if (ls) ls.textContent = t.langLabel;
      renderHistory();
    }

    function toggleLang() { applyLang(currentLang === 'zh' ? 'en' : 'zh'); }

    // ── Toast ────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${type} visible`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('visible'), 3000);
    }

    // ── App entry (已移除访问密码，公开访问) ──
    function getAuthToken() { return ''; }

    function enterApp() {
      document.getElementById('mainApp').style.display = '';
      applyLang(currentLang);
      document.getElementById('footerCopy').textContent = `© ${new Date().getFullYear()} TikSaver · ${I18N[currentLang].privateTag}`;
      renderHistory();
    }

    // ── Form actions ────────────────────────────
    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
        showToast(I18N[currentLang].toastPasteSuccess, 'success');
      } catch { showToast(I18N[currentLang].toastPasteFail, 'error'); }
    }

    function clearInput() {
      document.getElementById('urlInput').value = '';
      document.getElementById('errorMsg').classList.remove('visible');
      document.getElementById('resultArea').classList.remove('visible');
      document.getElementById('skeletonCard').classList.remove('visible');
      document.getElementById('urlInput').focus();
    }

    async function parseVideo() {
      const input = document.getElementById('urlInput');
      const btn = document.getElementById('parseBtn');
      const errEl = document.getElementById('errorMsg');
      const resultArea = document.getElementById('resultArea');
      const skeleton = document.getElementById('skeletonCard');
      const t = I18N[currentLang];

      const url = input.value.trim();
      errEl.classList.remove('visible');
      resultArea.classList.remove('visible');

      if (!url) { errEl.textContent = t.errorEmpty; errEl.classList.add('visible'); return; }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${t.btnParsing}`;
      skeleton.classList.add('visible');

      try {
        const res = await fetch('/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();
        skeleton.classList.remove('visible');

        if (res.ok && data.success && data.data) {
          displayResult(data.data);
          addToHistory(data.data);
        } else {
          let errMsg = data.message || t.errorParse;
          if (data.detail && data.detail !== errMsg) {
            errMsg += `<br><span style="font-size:12px;color:#9ca3af;word-break:break-all;">${escapeHtml(data.detail)}</span>`;
          }
          errEl.innerHTML = errMsg;
          errEl.classList.add('visible');
        }
      } catch (e) {
        skeleton.classList.remove('visible');
        errEl.textContent = t.errorParse;
        errEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = t.btnParse;
      }
    }

    function displayResult(d) {
      const area = document.getElementById('resultArea');
      const video = document.getElementById('resultVideo');
      const imagesEl = document.getElementById('resultImages');
      const avatar = document.getElementById('resultAvatar');
      const author = document.getElementById('resultAuthor');
      const desc = document.getElementById('resultDesc');
      const stats = document.getElementById('resultStats');
      const badge = document.getElementById('resultTypeBadge');
      const dlVideo = document.getElementById('downloadVideo');
      const dlMusic = document.getElementById('downloadMusic');
      const dlAllImg = document.getElementById('downloadAllImages');
      const t = I18N[currentLang];

      const platformNames = {
        tiktok: 'TikTok', douyin: '抖音', kuaishou: '快手',
        xiaohongshu: '小红书', bilibili: '哔哩哔哩', youtube: 'YouTube', instagram: 'Instagram',
      };
      const pfName = platformNames[d.platform] || 'Video';
      const pfPrefix = (d.platform || 'video').replace(/[^a-z0-9]/gi, '');

      avatar.src = d.avatar || '';
      avatar.style.display = d.avatar ? '' : 'none';
      author.innerHTML = `${escapeHtml(d.author || 'Unknown')} <span class="platform-tag">${pfName}</span>`;
      desc.textContent = d.desc || '';

      // Type badge
      const isImage = d.type === 'image' && d.images && d.images.length > 0;
      badge.textContent = isImage ? t.badgeImage : t.badgeVideo;
      badge.className = `result-type-badge ${isImage ? 'image' : 'video'}`;

      // Reset displays
      video.style.display = 'none';
      imagesEl.style.display = 'none';
      dlVideo.style.display = 'none';
      dlAllImg.style.display = 'none';
      dlMusic.style.display = 'none';
      document.getElementById('copyLinkBtn').style.display = 'none';
      document.getElementById('resultCoverWrap').style.display = 'none';

      // 保存当前结果供复制链接使用
      window._lastResult = d;

      if (isImage) {
        // Image gallery
        imagesEl.style.display = 'grid';
        imagesEl.innerHTML = d.images.map((imgUrl, i) =>
          `<img src="${imgUrl}" alt="Image ${i+1}" onclick="openLightbox('${imgUrl}')" onerror="this.style.display='none'" />`
        ).join('');

        // Download all images button
        dlAllImg.style.display = '';
        dlAllImg.href = 'javascript:void(0)';
        dlAllImg.onclick = () => downloadAllImages(d.images);
      } else {
        // Video - 通过代理播放（带 preview=1 参数，支持流式播放和 Range 请求）
        const proxyVideoUrl = '/api/download?preview=1&url=' + encodeURIComponent(d.videoUrl);
        const coverPreview = document.getElementById('resultCoverWrap');
        const coverImg = document.getElementById('resultCoverImg');

        video.style.display = '';
        video.poster = d.cover || '';
        video.src = proxyVideoUrl;

        // 视频加载失败时显示封面图回退
        video.onerror = function() {
          video.style.display = 'none';
          if (d.cover) {
            coverImg.src = d.cover;
            coverPreview.style.display = 'block';
            coverPreview.onclick = function() {
              window.open('/api/download?preview=1&url=' + encodeURIComponent(d.videoUrl), '_blank');
            };
          }
        };
        // 视频加载成功时隐藏封面图
        video.onloadeddata = function() {
          coverPreview.style.display = 'none';
        };

        if (d.videoUrl) {
          dlVideo.style.display = '';
          dlVideo.href = '/api/download?url=' + encodeURIComponent(d.videoUrl);
          dlVideo.download = `${pfPrefix}-${d.authorId || 'video'}.mp4`;
          document.getElementById('copyLinkBtn').style.display = '';
        }
      }

      // Music (available for both types)
      if (d.musicUrl) {
        dlMusic.style.display = '';
        dlMusic.href = '/api/download?url=' + encodeURIComponent(d.musicUrl);
        dlMusic.download = `${pfPrefix}-music.mp3`;
      }

      // Stats
      const statsHtml = [];
      if (d.playCount) statsHtml.push(`<span class="stat"><span class="stat-icon">▶️</span>${formatNum(d.playCount)}</span>`);
      if (d.diggCount) statsHtml.push(`<span class="stat"><span class="stat-icon">❤️</span>${formatNum(d.diggCount)}</span>`);
      if (d.commentCount) statsHtml.push(`<span class="stat"><span class="stat-icon">💬</span>${formatNum(d.commentCount)}</span>`);
      if (d.shareCount) statsHtml.push(`<span class="stat"><span class="stat-icon">🔗</span>${formatNum(d.shareCount)}</span>`);
      if (isImage && d.images.length) statsHtml.push(`<span class="stat"><span class="stat-icon">🖼️</span>${d.images.length} 张图片</span>`);
      stats.innerHTML = statsHtml.join('');

      // Platform note
      let noteEl = document.getElementById('resultNote');
      if (d.note) {
        if (!noteEl) {
          noteEl = document.createElement('div');
          noteEl.id = 'resultNote';
          noteEl.className = 'result-note';
          stats.parentElement.appendChild(noteEl);
        }
        noteEl.textContent = d.note;
        noteEl.style.display = '';
      } else if (noteEl) {
        noteEl.style.display = 'none';
      }

      // Save platform for downloadAllImages
      window._lastPlatform = d.platform;

      area.classList.add('visible');
      area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function copyVideoLink() {
      const d = window._lastResult;
      if (!d || !d.videoUrl) return;
      const link = '/api/download?url=' + encodeURIComponent(d.videoUrl);
      const fullUrl = window.location.origin + link;
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast(I18N[currentLang].toastCopied, 'success');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = fullUrl;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast(I18N[currentLang].toastCopied, 'success'); }
        catch { showToast('Copy failed', 'error'); }
        ta.remove();
      });
    }

    function downloadAllImages(images) {
      const pfPrefix = (window._lastPlatform || 'video').replace(/[^a-z0-9]/gi, '');
      images.forEach((imgUrl, i) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = '/api/download?url=' + encodeURIComponent(imgUrl);
          a.download = `${pfPrefix}-image-${i + 1}.jpg`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }, i * 300);
      });
    }

    function formatNum(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(n);
    }

    // ── Lightbox ────────────────────────────────
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('visible');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('visible'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Download History ────────────────────────
    function getHistory() {
      try { return JSON.parse(localStorage.getItem('tiktok-history') || '[]'); }
      catch { return []; }
    }

    function addToHistory(data) {
      const history = getHistory();
      const key = data.videoUrl || (data.images && data.images[0]) || '';
      const filtered = history.filter(h => (h.videoUrl || (h.images && h.images[0]) || '') !== key);
      filtered.unshift({
        author: data.author,
        authorId: data.authorId,
        platform: data.platform,
        desc: data.desc,
        cover: data.cover || (data.images && data.images[0]) || '',
        type: data.type,
        videoUrl: data.videoUrl,
        images: data.images,
        musicUrl: data.musicUrl,
        time: Date.now(),
      });
      localStorage.setItem('tiktok-history', JSON.stringify(filtered.slice(0, 20)));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');
      if (!section || !list) return;
      const t = I18N[currentLang];

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = '';
      list.innerHTML = history.map((h, i) => {
        const timeStr = new Date(h.time).toLocaleString(currentLang === 'zh' ? 'zh-CN' : 'en-US');
        const title = h.desc || h.author || 'Unknown';
        const platformNames = { tiktok: 'TikTok', douyin: '抖音', kuaishou: '快手', xiaohongshu: '小红书', bilibili: 'B站', youtube: 'YouTube', instagram: 'IG' };
        const pfTag = h.platform ? `<span class="platform-tag">${platformNames[h.platform] || ''}</span>` : '';
        return `<div class="history-item" onclick="restoreHistory(${i})">
          <img class="history-thumb" src="${h.cover || ''}" alt="" onerror="this.style.display='none'" />
          <div class="history-info">
            <div class="history-title">${escapeHtml(title)}</div>
            <div class="history-meta">@${escapeHtml(h.author || 'unknown')} · ${timeStr}</div>
          </div>
          ${pfTag}
          <span class="result-type-badge ${h.type === 'image' ? 'image' : 'video'}">${h.type === 'image' ? t.badgeImage : t.badgeVideo}</span>
        </div>`;
      }).join('');
    }

    function restoreHistory(index) {
      const history = getHistory();
      const item = history[index];
      if (!item) return;
      window._lastPlatform = item.platform || 'video';
      displayResult(item);
      document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
    }

    function clearHistory() {
      localStorage.removeItem('tiktok-history');
      renderHistory();
      showToast(I18N[currentLang].toastHistoryCleared, 'success');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ── Back to top ─────────────────────────────
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > 400) btn.classList.add('visible');
      else btn.classList.remove('visible');
    });

    // Enter key to parse
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('urlInput');
      if (urlInput) urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') parseVideo(); });
    });

    // ── Theme Switch ────────────────────────────
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('tiksaver-theme', theme);
      const btns = [document.getElementById('themeSwitch')];
      btns.forEach(btn => { if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙'; });
    }

    // ── Init ─────────────────────────────────────
    (() => {
      const stored = localStorage.getItem('tiksaver-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(stored || (prefersDark ? 'dark' : 'light'));
      // 移除访问密码：公开访问，直接进入主界面
      enterApp();
    })();
  </script>
</body>
</html>
